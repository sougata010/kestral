[package]
name = "kestrel"
version = "0.1.0"
description = "A developer-first, cybersecurity-hardened, privacy-focused browser built in Rust."
authors = ["Kestrel Team"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "kestrel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kestrel"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
